# Package: xue_hua_barcode_scanner
# Author: Matkurban <3496354336@qq.com>
# Repository: https://github.com/Matkurban/xue_hua_barcode_scanner
name: xue_hua_barcode_scanner
description: "Flutter barcode and QR recognition, generation, and real-time camera scanner for Android, iOS, macOS, Windows, Linux, and Web, powered by zxing-cpp."
version: 1.0.3
homepage: https://github.com/Matkurban/xue_hua_barcode_scanner
repository: https://github.com/Matkurban/xue_hua_barcode_scanner
issue_tracker: https://github.com/Matkurban/xue_hua_barcode_scanner/issues

topics:
  - barcode
  - barcode-scanner
  - qrcode
  - zxing-cpp
  - ffi

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  ffi: ^2.2.0
  material_ui: ^1.8.0
  chat_context_menu: ^4.2.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  ffigen: ^23.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_barcode_scanner
        pluginClass: XueHuaBarcodeScannerPlugin
        ffiPlugin: true
      ios:
        pluginClass: XueHuaBarcodeScannerPlugin
        ffiPlugin: true
      linux:
        pluginClass: XueHuaBarcodeScannerPlugin
        ffiPlugin: true
      macos:
        pluginClass: XueHuaBarcodeScannerPlugin
        ffiPlugin: true
      windows:
        pluginClass: XueHuaBarcodeScannerPluginCApi
        ffiPlugin: true
      web:
        pluginClass: XueHuaBarcodeScannerWeb
        fileName: src/web/scanner_web.dart
