# Package: xue_hua_barcode_scanner
# Author: Matkurban <3496354336@qq.com>
# Repository: https://github.com/Matkurban/xue_hua_barcode_scanner
name: xue_hua_barcode_scanner
description: "A 6-platform (Android, iOS, macOS, Windows, Linux, Web) Flutter QR Code & Barcode recognition, generation, and real-time camera scanner plugin powered by zxing-cpp FFI & WebAssembly."
version: 0.1.0
homepage: https://github.com/Matkurban/xue_hua_barcode_scanner
repository: https://github.com/Matkurban/xue_hua_barcode_scanner
issue_tracker: https://github.com/Matkurban/xue_hua_barcode_scanner/issues

topics:
  - qrcode
  - barcode-scanner
  - zxing-cpp
  - ffi
  - camera

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  ffigen: ^23.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: XueHuaBarcodeScannerWeb
        fileName: src/web/scanner_web.dart
